type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone"
    type: string
    example: '+380937777777'
  email:
    type: string
    example: dima@example.com   
  isFavourite:
    type: boolean
  contactType:
    type: string
    enum: ['work', 'home', 'personal']
    default: 'personal'
  userId:
    description: "User id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    description: "time of creation of the contact"
    type: string
  updatedAt:
    description: "time of creation of the contact"
    type: string