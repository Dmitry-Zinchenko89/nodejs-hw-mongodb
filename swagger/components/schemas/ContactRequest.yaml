type: object
properties:
  name:
    type: string
    example: "John Doe"
  phoneNumber:
    type: string
    example: "+380501112233"
  email:
    type: string
    format: email
  contactType:
    type: string
    enum: [personal, work, family, other]
    example: personal
  isFavourite:
    type: boolean
    default: false
required: [ name, phoneNumber, contactType ]