tags: [Contacts]
summary: Update contact
operationId: updateContact
description: Partially updates contact fields.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema: { type: string }
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name: { type: string }
          phoneNumber: { type: string }
          email: { type: string, format: email, }
          contactType:
            type: string
            enum: [personal, work, family, other]
          isFavourite: { type: boolean }
responses:
  "200":
    description: Updated
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ContactResponse.yaml
  "400":
    description: Invalid body
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ErrorResponse.yaml
  "401":
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ErrorResponse.yaml
  "404":
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ErrorResponse.yaml