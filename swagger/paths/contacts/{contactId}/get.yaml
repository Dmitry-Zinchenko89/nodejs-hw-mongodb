tags: [Contacts]
summary: Get contact by ID
operationId: getContactById
description: Returns a single contact by its contactId.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Contact ID
    schema: { type: string }
responses:
  "200":
    description: OK
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ContactResponse.yaml
  "401":
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ErrorResponse.yaml
  "404":
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ErrorResponse.yaml